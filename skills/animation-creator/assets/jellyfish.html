<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riso Jellyfish — five second procedural print</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #15141a; color: #efe8d6; font: 15px/1.4 system-ui, -apple-system, "Helvetica Neue", sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; }
  #stage { width: min(92vw, 82vh); height: auto; aspect-ratio: 1 / 1; display: block; box-shadow: 0 30px 80px rgba(0,0,0,.55); background: #f4eedc; }
  body.static main { padding: 0; min-height: 0; display: block; }
  body.static #stage { width: 1080px; height: 1080px; box-shadow: none; }
  .controls { display: flex; align-items: center; gap: 12px; }
  .controls[hidden] { display: none; }
  button { font: inherit; padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(239,232,214,.35); background: transparent; color: inherit; cursor: pointer; min-width: 92px; }
  button:hover { background: rgba(239,232,214,.10); }
  button:focus-visible { outline: 3px solid #ff3d9a; outline-offset: 3px; }
  output { font-variant-numeric: tabular-nums; opacity: .7; min-width: 9ch; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<main>
  <canvas id="stage" width="1080" height="1080" role="img"
    aria-label="Risograph-style print of a large fluorescent pink jellyfish rising through deep cobalt water, with trailing tendrils, smaller distant jellyfish, drifting particles and thin orbital rings."></canvas>
  <div class="controls" id="controls">
    <button id="btnPlay" type="button" aria-pressed="false">Pause</button>
    <button id="btnReplay" type="button">Replay</button>
    <output id="frameOut" for="stage" aria-live="off">frame 0 / 120</output>
    <span class="vh" id="motionNote"></span>
  </div>
</main>
<script>
'use strict';
/* ------------------------------------------------------------------
   Riso jellyfish — one scene, 120 frames @ 24 fps, 1080 x 1080.
   Everything is procedural Canvas 2D. Three ink separations (cobalt
   blue, fluorescent pink, yellow) are drawn as grayscale coverage maps,
   then pushed through seeded angled halftone screens with irregular
   ink, slight registration slip, and multiplied onto grainy ivory paper.
   Contract:  window.renderFrame(frame, seed) -> Promise (canvas holds
   that frame when it resolves; pure function of frame + seed).
   ?f=N&s=N renders one static frame with no animation loop.
------------------------------------------------------------------ */
const W = 1080, H = 1080, N = W * H;
window.FPS = 24;
window.TOTAL_FRAMES = 120;
const DEFAULT_SEED = 7;
const LOOP_SECONDS = window.TOTAL_FRAMES / window.FPS;      // 5 s
const TAU = Math.PI * 2;
const PULSE_PERIOD = 2.5;                                    // two pulses per loop

// ---------- seeded randomness ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- stable textures (cached per seed) ----------
const INKS = [
  { name: 'blue',   rgb: [0x1d, 0x3f, 0x9e], angle: 15 * Math.PI / 180, cell: 6.2 },
  { name: 'pink',   rgb: [0xff, 0x3d, 0x9a], angle: 75 * Math.PI / 180, cell: 5.6 },
  { name: 'yellow', rgb: [0xff, 0xd2, 0x3f], angle: 45 * Math.PI / 180, cell: 6.8 },
];
const TEX = { seed: null, paper: null, thr: [], mod: [], reg: [] };

function valueNoise(seed, cell) {
  const rng = mulberry32(seed);
  const gw = Math.ceil(W / cell) + 2, gh = Math.ceil(H / cell) + 2;
  const g = new Float32Array(gw * gh);
  for (let i = 0; i < g.length; i++) g[i] = rng();
  const out = new Float32Array(N);
  for (let y = 0; y < H; y++) {
    const gy = y / cell, iy = gy | 0, fy = gy - iy, sy = fy * fy * (3 - 2 * fy);
    for (let x = 0; x < W; x++) {
      const gx = x / cell, ix = gx | 0, fx = gx - ix, sx = fx * fx * (3 - 2 * fx);
      const i0 = iy * gw + ix;
      const a = g[i0] + (g[i0 + 1] - g[i0]) * sx;
      const b = g[i0 + gw] + (g[i0 + gw + 1] - g[i0 + gw]) * sx;
      out[y * W + x] = a + (b - a) * sy;
    }
  }
  return out;
}

function buildTextures(seed) {
  if (TEX.seed === seed) return TEX;
  const rng = mulberry32(seed * 7919 + 13);
  const wn = new Uint8Array(N);
  for (let i = 0; i < N; i++) wn[i] = rng() * 256;
  const blotch = valueNoise(seed * 31 + 1, 46);
  const fine = valueNoise(seed * 31 + 2, 12);
  const fibre = valueNoise(seed * 31 + 3, 3.3);

  // paper: ivory with fibres and soft mottling
  const paper = new Uint8ClampedArray(N * 3);
  for (let i = 0, q = 0; i < N; i++, q += 3) {
    const g = (wn[i] - 128) * 0.03 + (blotch[i] - .5) * 6 + (fine[i] - .5) * 4 + (fibre[i] - .5) * 3.5;
    paper[q] = 244 + g; paper[q + 1] = 238 + g * 1.05; paper[q + 2] = 221 + g * 1.3;
  }

  // registration slip per ink (blue is the key plate)
  const regRng = mulberry32(seed * 101 + 5);
  const reg = [[0, 0]];
  for (let k = 1; k < 3; k++) {
    const ang = regRng() * TAU, mag = 2.2 + regRng() * 2.2;
    reg.push([Math.cos(ang) * mag, Math.sin(ang) * mag]);
  }

  // halftone threshold + ink irregularity per ink
  const thr = [], mod = [];
  for (let k = 0; k < 3; k++) {
    const ink = INKS[k];
    const cs = Math.cos(ink.angle), sn = Math.sin(ink.angle), c = ink.cell;
    const T = new Uint8Array(N), M = new Uint8Array(N);
    const ox = (k * 397) % W, oy = (k * 211) % H;
    for (let y = 0; y < H; y++) {
      const yy = (y + oy) % H;
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        const j = yy * W + ((x + ox) % W);
        const u = (x * cs + y * sn) / c, v = (-x * sn + y * cs) / c;
        const fu = u - Math.round(u), fv = v - Math.round(v);
        const d2 = (fu * fu + fv * fv) * 2;          // 0 centre .. 1 corner
        let t = d2 * 0.94 + (wn[j] / 255 - .5) * 0.11 + (blotch[j] - .5) * 0.12 + (fine[j] - .5) * 0.06;
        T[i] = clamp(t, 0.02, 0.985) * 255;
        M[i] = clamp(0.80 + 0.22 * blotch[j] + (fine[j] - .5) * 0.10, 0.6, 1) * 255;
      }
    }
    thr.push(T); mod.push(M);
  }
  TEX.seed = seed; TEX.paper = paper; TEX.thr = thr; TEX.mod = mod; TEX.reg = reg;
  return TEX;
}

// ---------- scene geometry (cached per seed) ----------
const PLATE = { x: 72, y: 72, w: 936, h: 936 };
const SCENE = { seed: null };

function buildScene(seed) {
  if (SCENE.seed === seed) return SCENE;
  const rng = mulberry32(seed * 1013 + 77);
  const S = { seed };
  S.hero = { cx: 540, cy: 458, R: 186, Hd: 178 };
  S.hero.tendrils = makeTendrils(rng, S.hero, 1);
  S.distant = [
    { cx: 262, cy: 318, R: 52, Hd: 48, ph: 0.35, fade: 0.55, tilt: -0.18 },
    { cx: 842, cy: 262, R: 38, Hd: 36, ph: 0.72, fade: 0.42, tilt: 0.12 },
    { cx: 302, cy: 812, R: 30, Hd: 28, ph: 0.15, fade: 0.36, tilt: 0.22 },
    { cx: 876, cy: 880, R: 24, Hd: 22, ph: 0.55, fade: 0.28, tilt: -0.08 },
  ].map(d => { d.tendrils = makeTendrils(rng, d, d.R / 186); return d; });
  // particles
  S.particles = [];
  for (let i = 0; i < 170; i++) {
    const r = rng();
    S.particles.push({
      x: PLATE.x + 14 + rng() * (PLATE.w - 28), y: PLATE.y + 14 + rng() * (PLATE.h - 28),
      r: 1.1 + Math.pow(rng(), 2.2) * 3.2, rise: 18 + rng() * 60, ph: rng(),
      kind: r < .5 ? 'paper' : r < .8 ? 'pink' : 'yellow', a: .35 + rng() * .6,
      wob: 3 + rng() * 6, wph: rng() * TAU,
    });
  }
  S.rings = [
    { rx: 322, ry: 108, rot: -0.22, ink: 'yellow', a: .62, w: 2.2, dot: true, dotPh: 0.0 },
    { rx: 402, ry: 158, rot: 0.16, ink: 'pink', a: .5, w: 1.8, dot: true, dotPh: 0.5 },
    { rx: 470, ry: 92, rot: -0.55, ink: 'pink', a: .32, w: 1.4, dot: false },
  ];
  S.shafts = [];
  for (let i = 0; i < 4; i++) S.shafts.push({ x: 180 + i * 210 + rng() * 80, w: 40 + rng() * 70, lean: -0.32 - rng() * 0.12, a: .05 + rng() * .05 });
  SCENE.seed = seed; Object.assign(SCENE, S);
  return SCENE;
}

function makeTendrils(rng, jelly, scale) {
  const list = [];
  const big = scale > 0.6;
  const nThin = big ? 26 : 7, nArms = big ? 4 : 0;
  for (let i = 0; i < nThin; i++) {
    const s = -0.94 + (i + 0.5) / nThin * 1.88 + (rng() - .5) * 0.05;
    list.push({
      type: 'thin', s, ink: rng() < 0.42 ? 'yellow' : 'pink',
      len: (280 + rng() * 300) * scale, seg: big ? 44 : 18,
      w0: (2.2 + rng() * 2.6) * scale, sway: .25 + rng() * .35, lam: 110 + rng() * 90,
      ph: rng() * TAU, curl: (rng() < .5 ? -1 : 1) * (1.2 + rng() * 2.2), ph2: rng() * TAU,
      spread: s * (0.35 + rng() * 0.25), drift: (rng() - .5) * 0.2, a: .55 + rng() * .4,
    });
  }
  for (let i = 0; i < nArms; i++) {
    const s = -0.55 + i / (nArms - 1) * 1.1;
    list.push({
      type: 'arm', s, ink: 'pink', len: (300 + rng() * 120) * scale, seg: 40,
      w0: (16 + rng() * 8) * scale, sway: .18 + rng() * .1, lam: 160 + rng() * 60,
      ph: rng() * TAU, curl: (rng() < .5 ? -1 : 1) * (0.9 + rng() * 1.1), ph2: rng() * TAU,
      spread: s * 0.32, drift: (rng() - .5) * 0.1, a: .8, frill: 5 + rng() * 3, frillLam: 7 + rng() * 4,
    });
  }
  // draw order: far (small s magnitude last so centre arms overlay)
  list.sort((a, b) => Math.abs(b.s) - Math.abs(a.s));
  return list;
}

// ---------- motion helpers (all periodic in LOOP_SECONDS) ----------
function pulse(t, ph) {                      // 0 relaxed .. 1 contracted; fast in, slow out
  const u = ((t / PULSE_PERIOD + ph) % 1 + 1) % 1;
  return u < 0.32 ? easeInOut(u / 0.32) : 1 - easeInOut((u - 0.32) / 0.68);
}
function jellyPose(j, t, ph, scale) {
  const p = pulse(t, ph);
  const pLag = pulse(t - 0.22, ph);
  const bob = -Math.sin(TAU * ((t / PULSE_PERIOD + ph) % 1) - 0.9) * 14 * scale;
  const sway = Math.sin(TAU * t / LOOP_SECONDS + ph * 6) * 7 * scale;
  return {
    cx: j.cx + sway, cy: j.cy + bob,
    R: j.R * (1 - 0.11 * p), Hd: j.Hd * (1 + 0.08 * p), p, pLag,
    tilt: (j.tilt || 0) + Math.sin(TAU * t / LOOP_SECONDS * 1 + ph * 4) * 0.035,
  };
}

function tendrilPoints(td, pose, t) {
  const K = td.seg, ds = td.len / K;
  const x0 = pose.cx + pose.R * td.s, y0 = pose.cy + 6;
  let x = x0, y = y0;
  const pts = [{ x, y }];
  const W1 = TAU * 2 / LOOP_SECONDS, W2 = TAU / LOOP_SECONDS;
  for (let k = 1; k <= K; k++) {
    const sf = k / K, s = k * ds;
    const lag = pulse(t - s / 520, 0) - 0.5;     // pulse travels down the tendril
    const ang = td.drift + pose.tilt * 0.6
      + td.spread * (0.35 + 0.65 * sf) * (1 - 0.35 * lag)
      + (0.12 + 0.55 * sf) * td.sway * Math.sin(W1 * t - s / td.lam + td.ph)
      + td.curl * sf * sf * sf * (0.75 + 0.35 * Math.sin(W2 * t + td.ph2));
    x += ds * Math.sin(ang); y += ds * Math.cos(ang);
    pts.push({ x, y });
  }
  return pts;
}

function ribbon(ctx, pts, widthAt) {
  const n = pts.length; if (n < 2) return;
  const L = [], Rr = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(i - 1, 0)], b = pts[Math.min(i + 1, n - 1)];
    let nx = -(b.y - a.y), ny = b.x - a.x;
    const m = Math.hypot(nx, ny) || 1; nx /= m; ny /= m;
    const w = widthAt(i / (n - 1)) / 2;
    L.push([pts[i].x + nx * w, pts[i].y + ny * w]);
    Rr.push([pts[i].x - nx * w, pts[i].y - ny * w]);
  }
  ctx.beginPath();
  ctx.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) ctx.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(Rr[i][0], Rr[i][1]);
  ctx.closePath();
  ctx.fill();
}

function bellPath(ctx, pose, scaleR = 1, scaleH = 1, lappets = 14, lip = 1) {
  const { cx, cy, tilt } = pose, R = pose.R * scaleR, Hd = pose.Hd * scaleH;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(tilt);
  ctx.beginPath();
  ctx.moveTo(-R, 0);
  const steps = 48;
  for (let i = 1; i <= steps; i++) {
    const a = Math.PI - (i / steps) * Math.PI;
    ctx.lineTo(R * Math.cos(a), -Hd * Math.pow(Math.sin(a), 0.78));
  }
  const dip = R * 0.065 * lip;
  for (let j = 0; j < lappets; j++) {
    const xa = R - (j / lappets) * 2 * R, xb = R - ((j + 1) / lappets) * 2 * R;
    ctx.quadraticCurveTo((xa + xb) / 2, dip * 2, xb, 0);
  }
  ctx.closePath();
  ctx.restore();
}

// ---------- ink layers ----------
const stage = document.getElementById('stage');
const ctx = stage.getContext('2d', { alpha: false });
const layers = INKS.map(() => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d', { willReadFrequently: true }); });
const [Lb, Lp, Ly] = layers;
const outImg = ctx.createImageData(W, H);

const white = a => `rgba(255,255,255,${a})`;
const black = a => `rgba(0,0,0,${a})`;
function inkCtx(name) { return name === 'pink' ? Lp : name === 'yellow' ? Ly : Lb; }

function drawScene(frame, seed) {
  const tex = buildTextures(seed);
  const S = buildScene(seed);
  const t = frame / window.FPS;

  for (let k = 0; k < 3; k++) {
    const c = layers[k];
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
    c.save();                                   // every frame starts from pristine state
    c.translate(tex.reg[k][0], tex.reg[k][1]);
    c.beginPath(); c.rect(PLATE.x, PLATE.y, PLATE.w, PLATE.h); c.clip();
  }
  try { drawInks(S, t); } finally { for (const c of layers) c.restore(); }
  compositeInks(tex);
}

function drawInks(S, t) {

  // --- sea (blue key plate + a little pink for depth) ---
  let g = Lb.createLinearGradient(0, PLATE.y, 0, PLATE.y + PLATE.h);
  g.addColorStop(0, white(0.80)); g.addColorStop(0.45, white(0.90)); g.addColorStop(1, white(0.97));
  Lb.fillStyle = g; Lb.fillRect(PLATE.x, PLATE.y, PLATE.w, PLATE.h);
  g = Lp.createLinearGradient(0, PLATE.y, 0, PLATE.y + PLATE.h);
  g.addColorStop(0, white(0.06)); g.addColorStop(0.6, white(0.14)); g.addColorStop(1, white(0.34));
  Lp.fillStyle = g; Lp.fillRect(PLATE.x, PLATE.y, PLATE.w, PLATE.h);
  // faint yellow at the top edge -> greenish surface light
  g = Ly.createLinearGradient(0, PLATE.y, 0, PLATE.y + 300);
  g.addColorStop(0, white(0.10)); g.addColorStop(1, white(0));
  Ly.fillStyle = g; Ly.fillRect(PLATE.x, PLATE.y, PLATE.w, 300);

  // --- light shafts (knock the blue back a touch) ---
  for (const sh of S.shafts) {
    for (const [c, a] of [[Lb, sh.a], [Ly, sh.a * 0.5]]) {
      c.fillStyle = white(0); // reset
      c.beginPath();
      c.moveTo(sh.x, PLATE.y); c.lineTo(sh.x + sh.w, PLATE.y);
      c.lineTo(sh.x + sh.w + sh.lean * 900 * -1, PLATE.y + 900); c.lineTo(sh.x + sh.lean * 900 * -1 - sh.w * 0.6, PLATE.y + 900);
      c.closePath();
      c.fillStyle = c === Lb ? black(a) : white(a); c.fill();
    }
  }

  // --- distant jellyfish (behind everything) ---
  for (const d of S.distant) drawJelly(jellyPose(d, t, d.ph, d.R / 186), d, t, d.fade, false);

  // --- particles: slow drifting motes with a smooth fade envelope ---
  for (const p of S.particles) {
    const u = ((t / LOOP_SECONDS + p.ph) % 1 + 1) % 1;
    const env = Math.pow(Math.sin(Math.PI * u), 1.6);
    const y = p.y + p.rise * (0.5 - u);
    const x = p.x + Math.sin(TAU * u * 1 + p.wph) * p.wob;
    const a = p.a * env;
    if (a < 0.01) continue;
    if (p.kind === 'paper') { Lb.fillStyle = black(a); Lb.beginPath(); Lb.arc(x, y, p.r + 0.4, 0, TAU); Lb.fill(); }
    else {
      Lb.fillStyle = black(a * 0.6); Lb.beginPath(); Lb.arc(x, y, p.r * 1.2, 0, TAU); Lb.fill();
      const c = inkCtx(p.kind); c.fillStyle = white(a); c.beginPath(); c.arc(x, y, p.r, 0, TAU); c.fill();
    }
  }

  // --- orbital rings around the hero ---
  const hp = jellyPose(S.hero, t, 0, 1);
  const ringCx = hp.cx, ringCy = hp.cy - hp.Hd * 0.35;
  for (const r of S.rings) {
    const c = inkCtx(r.ink);
    c.save(); c.translate(ringCx, ringCy); c.rotate(r.rot);
    c.strokeStyle = white(r.a); c.lineWidth = r.w;
    c.beginPath(); c.ellipse(0, 0, r.rx, r.ry, 0, 0, TAU); c.stroke();
    // knock blue lightly so the ring reads as a pale line
    Lb.save(); Lb.translate(ringCx, ringCy); Lb.rotate(r.rot);
    Lb.strokeStyle = black(r.a * 0.55); Lb.lineWidth = r.w + 0.8;
    Lb.beginPath(); Lb.ellipse(0, 0, r.rx, r.ry, 0, 0, TAU); Lb.stroke();
    if (r.dot) {
      const th = TAU * (t / LOOP_SECONDS + r.dotPh);
      const dx = r.rx * Math.cos(th), dy = r.ry * Math.sin(th);
      // small bead riding the ring: ink ring with a paper-bright centre
      Lb.fillStyle = black(0.92); Lb.beginPath(); Lb.arc(dx, dy, 7, 0, TAU); Lb.fill();
      c.fillStyle = white(0.95); c.beginPath(); c.arc(dx, dy, 7.5, 0, TAU); c.fill();
      c.fillStyle = '#000'; c.beginPath(); c.arc(dx, dy, 3.2, 0, TAU); c.fill();
    }
    Lb.restore(); c.restore();
  }

  // --- hero jellyfish ---
  drawJelly(hp, S.hero, t, 1, true);
}

function drawJelly(pose, j, t, fade, hero) {
  const { cx, cy, R, Hd } = pose;
  const scale = R / 186;
  const halo = R * 1.9;

  // glow halo: knock the blue out around the bell
  let g = Lb.createRadialGradient(cx, cy - Hd * 0.4, R * 0.3, cx, cy - Hd * 0.4, halo);
  g.addColorStop(0, black(0.55 * fade)); g.addColorStop(0.55, black(0.22 * fade)); g.addColorStop(1, black(0));
  Lb.fillStyle = g; Lb.beginPath(); Lb.arc(cx, cy - Hd * 0.4, halo, 0, TAU); Lb.fill();

  // tendrils first (they hang from the rim underside)
  for (const td of j.tendrils) {
    const pts = tendrilPoints(td, pose, t);
    const c = inkCtx(td.ink);
    if (td.type === 'arm') {
      const wAt = u => td.w0 * (1 - 0.75 * u) + Math.abs(Math.sin(u * td.len / td.frillLam)) * td.frill * (1 - 0.5 * u);
      Lb.fillStyle = black(0.78 * fade); ribbon(Lb, pts, u => wAt(u) + 3);
      c.fillStyle = white(td.a * fade); ribbon(c, pts, wAt);
      Ly.fillStyle = white(0.45 * fade); ribbon(Ly, pts, u => wAt(u) * 0.38);
      // ruffle edge line
      c.fillStyle = white(0.95 * fade); ribbon(c, pts, u => Math.max(0.8, wAt(u) * 0.12));
    } else {
      const wAt = u => td.w0 * (1 - 0.82 * u) + 0.6;
      const knock = td.ink === 'yellow' ? 0.86 : 0.7;
      Lb.fillStyle = black(knock * fade); ribbon(Lb, pts, u => wAt(u) + 2.2);
      c.fillStyle = white(td.a * fade); ribbon(c, pts, wAt);
      if (td.ink === 'yellow') { Lp.fillStyle = white(0.28 * fade); ribbon(Lp, pts, u => wAt(u) * 0.5); }
      // small beads along the tendril for detail
      if (hero) {
        c.fillStyle = white(0.95 * fade);
        for (let k = 6; k < pts.length - 2; k += 7) { const q = pts[k]; c.beginPath(); c.arc(q.x, q.y, wAt(k / (pts.length - 1)) * 0.9 + 0.6, 0, TAU); c.fill(); }
      }
    }
  }

  // bell: knock out the blue strongly so the pink prints bright
  bellPath(Lb, pose, 1.03, 1.03); Lb.fillStyle = black(0.82 * fade); Lb.fill();
  // translucent pink dome: airy at the apex, denser toward the rim
  bellPath(Lp, pose);
  g = Lp.createRadialGradient(cx, cy - Hd * 0.6, R * 0.1, cx, cy - Hd * 0.25, R * 1.05);
  g.addColorStop(0, white(0.16 * fade)); g.addColorStop(0.55, white(0.36 * fade)); g.addColorStop(1, white(0.66 * fade));
  Lp.fillStyle = g; Lp.fill();
  // yellow inner glow -> warm fluorescent core where pink and yellow overlap
  g = Ly.createRadialGradient(cx, cy - Hd * 0.4, 0, cx, cy - Hd * 0.4, R * 0.62);
  g.addColorStop(0, white(0.5 * fade)); g.addColorStop(0.6, white(0.18 * fade)); g.addColorStop(1, white(0));
  Ly.fillStyle = g; Ly.beginPath(); Ly.arc(cx, cy - Hd * 0.4, R * 0.62, 0, TAU); Ly.fill();
  if (hero) {
    // four small frilled gonad rings around the stomach
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2 + Math.PI / 4 + pose.tilt;
      const gx = cx + Math.cos(a) * R * 0.2, gy = cy - Hd * 0.38 + Math.sin(a) * Hd * 0.1;
      for (const [c, al, lw] of [[Ly, 0.8, 5], [Lp, 0.75, 2.6]]) {
        c.save(); c.translate(gx, gy); c.rotate(a);
        c.strokeStyle = white(al); c.lineWidth = lw; c.lineCap = 'round';
        c.beginPath();
        for (let m = 0; m <= 28; m++) {
          const th = m / 28 * TAU, rr = 1 + 0.16 * Math.sin(th * 6);
          const px = Math.cos(th) * R * 0.1 * rr, py = Math.sin(th) * R * 0.058 * rr;
          m ? c.lineTo(px, py) : c.moveTo(px, py);
        }
        c.stroke(); c.restore();
      }
    }
  }
  // ribs (radial canals) from apex to rim: pink line plus a little blue -> violet definition
  const ribs = hero ? 18 : 8;
  for (const [c, al, lw] of [[Lp, 0.95, hero ? 2.4 : 1.4], [Lb, 0.42, hero ? 1.6 : 1]]) {
    c.save(); c.translate(cx, cy); c.rotate(pose.tilt);
    c.strokeStyle = white(al * fade); c.lineWidth = lw; c.lineCap = 'round';
    for (let k = 0; k <= ribs; k++) {
      const a = Math.PI - (k / ribs) * Math.PI;
      const ex = R * Math.cos(a) * 0.985, ey = -Hd * Math.pow(Math.sin(a), 0.78) * 0.02;
      const bend = Math.sin(a * 2) * 0.12;
      c.beginPath(); c.moveTo(0, -Hd * 0.985);
      c.bezierCurveTo(ex * 0.25 + bend * R, -Hd * 0.9, ex * 0.72, -Hd * 0.55 * Math.pow(Math.sin(a), 0.4), ex, ey);
      c.stroke();
    }
    if (hero) {   // finer secondary ribs between the main canals
      c.lineWidth = lw * 0.5; c.strokeStyle = white(al * 0.6 * fade);
      for (let k = 0; k < ribs; k++) {
        const a = Math.PI - ((k + 0.5) / ribs) * Math.PI;
        const ex = R * Math.cos(a) * 0.985;
        c.beginPath(); c.moveTo(ex * 0.12, -Hd * 0.86);
        c.bezierCurveTo(ex * 0.35, -Hd * 0.82, ex * 0.72, -Hd * 0.5 * Math.pow(Math.sin(a), 0.4), ex, 0);
        c.stroke();
      }
    }
    c.restore();
  }
  // inner bell (subumbrella) outline and velum band at the rim
  bellPath(Lp, pose, 0.74, 0.62, 10, 0.6); Lp.strokeStyle = white(0.85 * fade); Lp.lineWidth = hero ? 2 : 1.2; Lp.stroke();
  bellPath(Lp, pose); Lp.strokeStyle = white(0.98 * fade); Lp.lineWidth = hero ? 3.4 : 1.8; Lp.stroke();
  bellPath(Lb, pose); Lb.strokeStyle = white(0.5 * fade); Lb.lineWidth = hero ? 2.2 : 1.2; Lb.stroke();
  if (hero) {   // beads at the lappet joints along the rim
    Lp.save(); Lp.translate(cx, cy); Lp.rotate(pose.tilt); Lp.fillStyle = white(fade);
    for (let j = 0; j <= 14; j++) { const x = R - (j / 14) * 2 * R; Lp.beginPath(); Lp.arc(x, 1.5, 2.6, 0, TAU); Lp.fill(); }
    Lp.restore();
  }
  // pale specular arc near the apex: knock pink and blue so paper shows through
  for (const [c, al, lw] of [[Lp, 0.6, hero ? 10 : 4], [Lb, 0.35, hero ? 12 : 5]]) {
    c.save(); c.translate(cx, cy); c.rotate(pose.tilt);
    c.strokeStyle = black(al * fade); c.lineWidth = lw; c.lineCap = 'round';
    c.beginPath(); c.ellipse(-R * 0.18, -Hd * 0.7, R * 0.42, Hd * 0.2, -0.35, Math.PI * 1.05, Math.PI * 1.75); c.stroke();
    c.restore();
  }
}

function compositeInks(tex) {
  const B = Lb.getImageData(0, 0, W, H).data;
  const P = Lp.getImageData(0, 0, W, H).data;
  const Y = Ly.getImageData(0, 0, W, H).data;
  const o = outImg.data, pap = tex.paper;
  const tB = tex.thr[0], tP = tex.thr[1], tY = tex.thr[2];
  const mB = tex.mod[0], mP = tex.mod[1], mY = tex.mod[2];
  const E = 13, E2 = 1 / (2 * E);
  const kB = INKS[0].rgb.map(v => 1 - v / 255), kP = INKS[1].rgb.map(v => 1 - v / 255), kY = INKS[2].rgb.map(v => 1 - v / 255);
  const [kBr, kBg, kBb] = kB, [kPr, kPg, kPb] = kP, [kYr, kYg, kYb] = kY;
  for (let i = 0, p = 0, q = 0; i < N; i++, p += 4, q += 3) {
    let r = pap[q], g = pap[q + 1], b = pap[q + 2];
    let c = B[p], t = tB[i];
    if (c > t - E) { let a = c >= t + E ? 1 : (c - t + E) * E2; a *= mB[i] / 255; r -= r * a * kBr; g -= g * a * kBg; b -= b * a * kBb; }
    c = P[p]; t = tP[i];
    if (c > t - E) { let a = c >= t + E ? 1 : (c - t + E) * E2; a *= mP[i] / 255; r -= r * a * kPr; g -= g * a * kPg; b -= b * a * kPb; }
    c = Y[p]; t = tY[i];
    if (c > t - E) { let a = c >= t + E ? 1 : (c - t + E) * E2; a *= mY[i] / 255; r -= r * a * kYr; g -= g * a * kYg; b -= b * a * kYb; }
    o[p] = r; o[p + 1] = g; o[p + 2] = b; o[p + 3] = 255;
  }
  ctx.putImageData(outImg, 0, 0);
}

// ---------- public contract ----------
window.renderFrame = function (frame, seed) {
  frame = ((Math.floor(+frame) % window.TOTAL_FRAMES) + window.TOTAL_FRAMES) % window.TOTAL_FRAMES;
  seed = Number.isFinite(+seed) ? Math.floor(+seed) : DEFAULT_SEED;
  drawScene(frame, seed);
  return Promise.resolve(frame);
};

// ---------- page modes ----------
(function boot() {
  const params = new URLSearchParams(location.search);
  const seed = params.has('s') ? parseInt(params.get('s'), 10) : DEFAULT_SEED;
  const controls = document.getElementById('controls');
  const btnPlay = document.getElementById('btnPlay');
  const btnReplay = document.getElementById('btnReplay');
  const frameOut = document.getElementById('frameOut');
  const motionNote = document.getElementById('motionNote');

  if (params.has('f')) {                       // static frame mode: render once, no loop
    controls.hidden = true;
    document.body.classList.add('static');
    window.__rafRunning = false;
    window.__staticReadyPromise = window.renderFrame(parseInt(params.get('f'), 10) || 0, seed)
      .then(() => { window.__staticReady = true; });
    return;
  }

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduced, frame = 0, t0 = 0, last = -1, rafId = 0;
  window.__rafRunning = false;

  function setLabel() {
    frameOut.value = `frame ${frame} / ${window.TOTAL_FRAMES}`;
    btnPlay.textContent = playing ? 'Pause' : 'Play';
    btnPlay.setAttribute('aria-pressed', playing ? 'false' : 'true');
  }
  function show(f) { if (f !== last) { last = f; window.renderFrame(f, seed); frame = f; setLabel(); } }
  function tick(now) {
    if (!playing) { window.__rafRunning = false; return; }
    const f = Math.floor((now - t0) / 1000 * window.FPS) % window.TOTAL_FRAMES;
    show(f);
    rafId = requestAnimationFrame(tick);
  }
  function start(fromFrame) {
    cancelAnimationFrame(rafId);
    playing = true; window.__rafRunning = true;
    t0 = performance.now() - (fromFrame / window.FPS) * 1000;
    setLabel();
    rafId = requestAnimationFrame(tick);
  }
  btnPlay.addEventListener('click', () => { if (playing) { playing = false; cancelAnimationFrame(rafId); window.__rafRunning = false; setLabel(); } else start(frame); });
  btnReplay.addEventListener('click', () => { last = -1; start(0); });
  document.addEventListener('keydown', e => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); btnPlay.click(); } });

  if (reduced) {
    motionNote.textContent = 'Reduced motion is on: the animation starts paused. Press Play to run it.';
    show(0);
  } else {
    start(0);
  }
})();
</script>
